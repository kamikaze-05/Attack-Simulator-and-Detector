title: Suspicious Access to LSASS Process
id: T1003.001
tactic: Credential Access
severity: critical
description: >
  Detects a non-allowlisted process requesting high-privilege access
  (Sysmon Event ID 10, GrantedAccess indicating full/read memory rights)
  to lsass.exe, consistent with credential dumping tools such as
  Mimikatz or ProcDump misuse.
